name: Package Faster Whisper Arabic Runtime

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download runtime wheels
        run: |
          set -euo pipefail
          mkdir -p wheels model
          python -m pip install --upgrade pip
          python -m pip download --only-binary=:all: \
            --dest wheels \
            faster-whisper==1.2.0
          ls -lh wheels

      - name: Download multilingual small model
        run: |
          set -euo pipefail
          python -m pip install huggingface-hub
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='Systran/faster-whisper-small',
              local_dir='model',
          )
          PY
          du -sh model wheels

      - name: Upload runtime wheels
        uses: actions/upload-artifact@v4
        with:
          name: faster-whisper-wheels
          path: wheels
          compression-level: 0
          retention-days: 1

      - name: Upload small multilingual model
        uses: actions/upload-artifact@v4
        with:
          name: faster-whisper-small-model
          path: model
          compression-level: 0
          retention-days: 1
