name: Build Whisper Arabic Runtime

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Build whisper.cpp CLI
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.9.1 https://github.com/ggml-org/whisper.cpp.git
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build whisper.cpp/build --config Release -j2
          mkdir -p runtime
          cp whisper.cpp/build/bin/whisper-cli runtime/
          find whisper.cpp/build -type f -name '*.so*' -exec cp -a {} runtime/ \;

      - name: Download stronger multilingual and VAD models
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o runtime/ggml-small-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin
          curl -L --fail --retry 3 \
            -o runtime/ggml-silero-v6.2.0.bin \
            https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v6.2.0.bin
          ls -lh runtime

      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: whisper-arabic-runtime-strong
          path: runtime
          compression-level: 0
          retention-days: 1
