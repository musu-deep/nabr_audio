name: Package Faster Whisper Arabic Runtime

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download runtime wheels
        run: |
          set -euo pipefail
          mkdir -p package/wheels
          python -m pip install --upgrade pip
          python -m pip download --only-binary=:all: \
            --dest package/wheels \
            faster-whisper==1.2.0
          ls -lh package/wheels

      - name: Download multilingual small model
        run: |
          set -euo pipefail
          python -m pip install huggingface-hub
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='Systran/faster-whisper-small',
              local_dir='package/model',
              local_dir_use_symlinks=False,
          )
          PY
          du -sh package/model package/wheels

      - name: Upload packaged runtime
        uses: actions/upload-artifact@v4
        with:
          name: faster-whisper-arabic-small
          path: package
          compression-level: 0
          retention-days: 1
