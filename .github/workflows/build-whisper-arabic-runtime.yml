name: Package Faster Whisper Compact Models

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-models:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download compact multilingual models
        run: |
          set -euo pipefail
          python -m pip install huggingface-hub
          python - <<'PY'
          from huggingface_hub import snapshot_download
          for repo, target in [
              ('Systran/faster-whisper-base', 'models/base'),
              ('Systran/faster-whisper-tiny', 'models/tiny'),
          ]:
              snapshot_download(repo_id=repo, local_dir=target)
          PY
          du -sh models/*

      - name: Upload compact models
        uses: actions/upload-artifact@v4
        with:
          name: faster-whisper-compact-models
          path: models
          compression-level: 0
          retention-days: 1
